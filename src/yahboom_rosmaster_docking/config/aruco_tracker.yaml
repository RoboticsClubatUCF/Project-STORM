/**:
  ros__parameters:
    # The camera driver publishes matching image and camera_info topics under cam_1.
    cam_base_topic: color/image_rect
    output_frame: ''
    marker_dict: 4X4_50
    image_is_rectified: true
    image_sub_compressed: false
    image_sub_qos:
      reliability: 2
      durability: 2
      depth: 1
    publish_tf: true
    # Coded marker edge is 0.075 m; its white margin makes the full target 0.10 m.
    marker_size: 0.075
