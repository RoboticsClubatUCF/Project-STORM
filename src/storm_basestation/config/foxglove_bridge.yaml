# =============================================================================
# foxglove_bridge.yaml: WebSocket bridge for Lichtblick / storm-dashboard
# =============================================================================

foxglove_bridge:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"

    # Only these topics go over WiFi (regex)
    topic_whitelist:
      - "^/diagnostics$"
      - "^/telemetry/.*"
      - "^/odom$"
      - "^/tf$"
      - "^/tf_static$"
      - "^/robot_description$"
      - "^/joint_states$"
      - "^/joy$"
      - "^/diff_drive_controller/cmd_vel_unstamped$"
      - "^/storm/teleop/status$"

    # Only the dashboard's teleop start/stop services are callable
    service_whitelist:
      - "^/storm/teleop/.*"

    # Read-only except teleop start/stop: viewers can't publish or change params.
    # Driving stays on /joy over DDS.
    capabilities:
      - connectionGraph
      - assets
      - services
