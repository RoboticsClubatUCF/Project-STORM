amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: false
    use_sim_time: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    use_sim_time: false
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /odom
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.3
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.7
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.05
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    use_sim_time: false
planner_server:
  ros__parameters:
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: true
    use_sim_time: false
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
    use_sim_time: false
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    enable_stamped_cmd_vel: true
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      track_unknown_space: false
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      footprint: '[[0.32, 0.47], [0.32, -0.47], [-0.32, -0.47], [-0.32, 0.47]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: objects ground
        objects:
          topic: /perception/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          obstacle_max_range: 10.0
          expected_update_rate: 0.6
        ground:
          topic: /perception/ground
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          raytrace_max_range: 10.0
          expected_update_rate: 0.6
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.1
      update_frequency: 1.0
      publish_frequency: 1.0
      always_send_full_costmap: true
      track_unknown_space: true
      footprint: '[[0.32, 0.47], [0.32, -0.47], [-0.32, -0.47], [-0.32, 0.47]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: objects ground
        objects:
          topic: /perception/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          obstacle_max_range: 10.0
          expected_update_rate: 0.6
        ground:
          topic: /perception/ground
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          raytrace_max_range: 10.0
          expected_update_rate: 0.6
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 3.0
      rolling_window: true
      width: 40
      height: 40
      use_sim_time: false
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity:
    - 0.3
    - 0.0
    - 0.7
    min_velocity:
    - -0.3
    - 0.0
    - -0.7
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    odom_topic: odom
    velocity_timeout: 0.3
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    use_sim_time: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0
    use_sim_time: false
collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_checked
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    base_shift_correction: true
    polygons: [StopZone, SlowZone]
    StopZone:
      type: polygon
      points: '[[1.1, 0.7], [1.1, -0.7], [-1.1, -0.7], [-1.1, 0.7]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_stop_zone
    SlowZone:
      type: polygon
      points: '[[1.8, 1.0], [1.8, -1.0], [-1.8, -1.0], [-1.8, 1.0]]'
      action_type: slowdown
      slowdown_ratio: 0.4
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_slow_zone
    observation_sources: [objects, scan]
    objects:
      type: pointcloud
      topic: /perception/obstacles
      min_height: -3.0
      max_height: 3.0
      enabled: true
      source_timeout: 1.0
    scan:
      type: scan
      topic: /scan
      enabled: true
      source_timeout: 1.0
