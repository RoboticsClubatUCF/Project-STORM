amcl:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: /scan
    set_initial_pose: false
    use_sim_time: false
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    robot_base_frame: base_footprint
    rotational_acc_lim: 1.0
    spin:
      plugin: nav2_behaviors::Spin
    use_sim_time: false
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odom
    robot_base_frame: base_footprint
    use_sim_time: false
controller_server:
  ros__parameters:
    FollowPath:
      BaseObstacle.scale: 0.05
      GoalAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalDist.scale: 24.0
      PathAlign.forward_point_distance: 0.2
      PathAlign.scale: 32.0
      PathDist.scale: 32.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 1.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      angular_granularity: 0.025
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      decel_lim_theta: -1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      linear_granularity: 0.05
      max_speed_xy: 0.3
      max_vel_theta: 0.7
      max_vel_x: 0.3
      max_vel_y: 0.0
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: dwb_core::DWBLocalPlanner
      short_circuit_trajectory_evaluation: true
      sim_time: 1.5
      stateful: true
      trans_stopped_velocity: 0.05
      transform_tolerance: 0.3
      vtheta_samples: 20
      vx_samples: 15
      vy_samples: 1
      xy_goal_tolerance: 0.2
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - goal_checker
    odom_topic: /odom
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
    progress_checker_plugins:
    - progress_checker
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[0.32, 0.47], [0.32, -0.47], [-0.32, -0.47], [-0.32, 0.47]]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 15.0
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: false
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[0.32, 0.47], [0.32, -0.47], [-0.32, -0.47], [-0.32, 0.47]]'
      global_frame: odom
      height: 5
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          obstacle_max_range: 10.0
          raytrace_max_range: 15.0
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      update_frequency: 5.0
      use_sim_time: false
      width: 5
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.3
      use_astar: true
    planner_plugins:
    - GridBased
    use_sim_time: false
smoother_server:
  ros__parameters:
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
    smoother_plugins:
    - simple_smoother
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: true
    feedback: OPEN_LOOP
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    max_velocity:
    - 0.3
    - 0.0
    - 0.7
    min_velocity:
    - -0.3
    - 0.0
    - -0.7
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 0.3
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    use_sim_time: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 0
    waypoint_task_executor_plugin: wait_at_waypoint
